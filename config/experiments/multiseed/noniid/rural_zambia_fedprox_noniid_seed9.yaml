# Non-IID variant — Dirichlet alpha=0.5
# Rural Zambia — High Network Impairment | FedProx (mu=0.01) | seed 9
# Run WITHOUT --iid flag (Dirichlet partitioning is the default):
#   python -m src.main --config config/experiments/multiseed/noniid/rural_zambia_fedprox_noniid_seed9.yaml
experiment_name: rural_zambia_fedprox_noniid_seed9
num_clients: 10
num_rounds: 20
fraction_fit: 0.5
algorithm: fedprox
mu: 0.01
dataset: mnist
local_epochs: 2
batch_size: 32
learning_rate: 0.01
seed: 9
output_dir: experiments/results/multiseed/noniid
network_profile:
  name: rural_zambia
  latency_min_ms: 300
  latency_max_ms: 800
  bandwidth_mbps: 1.2
  packet_loss_rate: 0.07
  dropout_probability: 0.15
  dropout_duration_rounds: 2
